function bills(){
let billTab='all';
const renderBillPendingSummary=()=>{
 const q=($('billSearch')?.value||'').trim().toLowerCase();
 const groups={};
 db.bills.filter(x=>String(x.status||'Pending').toLowerCase()==='pending').forEach(x=>{
  const e=emp(x.empId)||{}; const name=e.name||x.empId; const id=e.id||x.empId;
  if(q && !(String(name).toLowerCase().includes(q)||String(id).toLowerCase().includes(q)||String(x.id||'').toLowerCase().includes(q))) return;
  if(!groups[x.empId])groups[x.empId]={id,name,count:0,total:0};
  groups[x.empId].count++; groups[x.empId].total+=Number(x.amount||0);
 });
 const rows=Object.values(groups).sort((a,b)=>a.name.localeCompare(b.name));
 const totalCount=rows.reduce((s,x)=>s+x.count,0),totalAmount=rows.reduce((s,x)=>s+x.total,0);
 const box=$('billPendingSummary');
 if(box)box.innerHTML=`<div class="pending-head"><div><div class="pending-title">Pending Bill Summary</div><div class="pending-sub">Search employee name or ID to see how much is pending</div></div><div class="pending-total"><b>${totalCount}</b> Bills &nbsp;•&nbsp; <b>${money(totalAmount)}</b></div></div>${rows.length?`<div class="tablewrap"><table><thead><tr><th>Employee ID</th><th>Employee</th><th>Pending Bills</th><th>Pending Amount</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.id)}</td><td><strong>${esc(x.name)}</strong></td><td>${x.count}</td><td><strong>${money(x.total)}</strong></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty" style="padding:18px">No pending bills found for this search.</div>`}`;
};
const tabCounts=()=>({all:db.bills.length,pending:db.bills.filter(x=>String(x.status||'Pending').toLowerCase()==='pending').length,approved:db.bills.filter(x=>String(x.status||'Pending').toLowerCase()==='approved').length,rejected:db.bills.filter(x=>String(x.status||'Pending').toLowerCase()==='rejected').length});
const renderBillTable=()=>{
 const q=($('billSearch')?.value||'').trim().toLowerCase();
 const rows=db.bills.map((x,i)=>({x,i})).filter(({x})=>{
  const st=String(x.status||'Pending').toLowerCase();
  if(billTab!=='all'&&st!==billTab)return false;
  if(!q)return true;
  const e=emp(x.empId)||{};
  return [x.id,x.empId,e.name,x.date,x.category,x.vendor,x.invoice,x.description,x.status].some(v=>String(v||'').toLowerCase().includes(q));
 });
 const counts=tabCounts();
 const tab=(key,label)=>`<button type="button" class="bill-tab ${billTab===key?'active':''}" data-bill-tab="${key}">${label} <span>${counts[key]}</span></button>`;
 const body=rows.length?rows.map(({x,i})=>{
  const st=String(x.status||'Pending');
  const cls=st==='Approved'?'ok':st==='Rejected'?'due':'wait';
  let actions='';
  if(st==='Pending') actions=`<button class="btn approve" data-i="${i}">Approve</button> <button class="btn reject" data-i="${i}">Reject</button> `;
  // Approved and Rejected entries only show Edit; an Approved bill can no longer be rejected from the list.
  actions+=`<button class="btn editBill" data-i="${i}">Edit</button>`;
  return `<tr><td>${esc(x.id)}</td><td>${esc(emp(x.empId)?.name||x.empId)}</td><td>${fmt(x.date)}</td><td>${esc(x.category)}</td><td>${esc(x.vendor)}</td><td>${money(x.amount)}</td><td><span class="status ${cls}">${esc(st)}${st!=='Approved'?' — NOT COUNTING':''}</span></td><td>${actions}</td></tr>`;
 }).join(''):`<tr><td colspan="8"><div class="empty" style="padding:28px">No ${billTab==='all'?'':billTab+' '}bills found.</div></td></tr>`;
 $('billTabs').innerHTML=[tab('all','All'),tab('pending','Pending'),tab('approved','Approved'),tab('rejected','Rejected')].join('');
 $('billTableBody').innerHTML=body;
 document.querySelectorAll('[data-bill-tab]').forEach(b=>b.onclick=()=>{billTab=b.dataset.billTab;renderBillTable();renderBillPendingSummary()});
 document.querySelectorAll('.approve').forEach(b=>b.onclick=()=>{db.bills[Number(b.dataset.i)].status='Approved';save()});
 document.querySelectorAll('.reject').forEach(b=>b.onclick=()=>{if(confirm('Reject this bill? It will remain visible in the ledger but will NOT be counted.')){db.bills[Number(b.dataset.i)].status='Rejected';save()}});
 document.querySelectorAll('.editBill').forEach(b=>b.onclick=()=>openModal('bill',Number(b.dataset.i)));
};

function settlement(){$('page').innerHTML=`<div class="panel"><h2>Settlement Summary</h2><div class="note">Paid Amount offsets the Opening Balance: a negative opening balance is reduced toward ₹0 by payment, while a positive opening balance is reduced by payment.</div><div class="tablewrap"><table><thead><tr><th>Employee</th><th>Opening Balance</th><th>Paid Amount</th><th>Advance</th><th>Approved Bills</th><th>Net Balance</th><th>Status</th><th>Action</th></tr></thead><tbody>${db.employees.map(e=>{const t=totals(e.id);return `<tr><td>${esc(e.name)}</td><td>${money(t.opening)}</td><td>${money(t.paid)}</td><td>${money(t.adv)}</td><td>${money(t.bills)}</td><td class="net-cell ${Math.abs(t.balance)<.005?'net-zero':t.balance>0?'net-positive':'net-negative'}"><div class="net-amount">${money(t.balance)}</div><small class="net-help ${Math.abs(t.balance)<.005?'net-settled':t.balance>0?'net-receive':'net-pay'}">${Math.abs(t.balance)<.005?'Settled / No Amount Due':t.balance>0?'Amount to Receive from Employee':'Amount to Pay to Employee'}</small></td><td>${status(t)}</td><td><button class="btn pay" data-id="${esc(e.id)}">Paid Amount</button></td></tr>`}).join('')}</tbody></table></div></div>`;document.querySelectorAll('.pay').forEach(b=>b.onclick=()=>payOpening(b.dataset.id))}
function payOpening(id){const e=emp(id);const v=prompt(`Opening Balance: ${money(e.opening)}\nCurrent Paid Amount: ${money(e.openingPaid)}\nEnter total Paid Amount:`);if(v!==null&&v.trim()!==''&&!isNaN(v)){e.openingPaid=Number(v);save()}}
function ledger(){const options=db.employees.map(e=>`<option value="${esc(e.id)}">${esc(e.id)} - ${esc(e.name)}</option>`).join('');$('page').innerHTML=`<div class="panel"><div class="print-only-title"><h1 style="margin:0 0 4px">Employee Expense / Advance Ledger</h1><div id="printEmployeeName" style="font-weight:700;margin-bottom:12px"></div></div><div class="ledger-toolbar"><div class="ledger-search-wrap"><span class="ledger-search-icon">🔎</span><input class="search ledger-search" id="ledgerSearch" placeholder="Search employee by name or ID..." autocomplete="off"></div><select id="ledgerEmp"><option value="">Select Employee</option>${options}</select><button class="btn" id="printLedger">Print Ledger</button></div><div class="ledger-search-hint">Type employee name or ID — matching employee will open automatically.</div><div id="ledgerArea" class="empty">Search an employee to generate ledger.</div></div>`;
$('ledgerEmp').value=selectedEmp;const search=$('ledgerSearch');const select=$('ledgerEmp');
const refreshOptions=()=>{const q=search.value.trim().toLowerCase();const current=selectedEmp;
const filtered=db.employees.filter(e=>!q||String(e.name||'').toLowerCase().includes(q)||String(e.id||'').toLowerCase().includes(q));
select.innerHTML='<option value="">Select Employee</option>'+filtered.map(e=>`<option value="${esc(e.id)}">${esc(e.id)} - ${esc(e.name)}</option>`).join('');
if(current&&filtered.some(e=>e.id===current)){select.value=current}
if(!q){if(current){const ee=emp(current);if(ee){select.value=current;drawLedger()}}}
else if(!filtered.length){selectedEmp='';$('ledgerArea').innerHTML='<div class="empty">No employee found. Try employee name or ID.</div>'}
else {
  const exact=filtered.find(e=>String(e.id||'').toLowerCase()===q || String(e.name||'').toLowerCase()===q);
  if(exact){selectedEmp=exact.id;select.value=exact.id;drawLedger()}
}};
search.oninput=refreshOptions;
select.onchange=e=>{selectedEmp=e.target.value;const ee=emp(selectedEmp);search.value=ee?ee.name:'';drawLedger()};
$('printLedger').onclick=()=>window.print();
if(selectedEmp){const ee=emp(selectedEmp);if(ee)search.value=ee.name}drawLedger()}
function drawLedger(){const area=$('ledgerArea');if(!area||!selectedEmp)return;const e=emp(selectedEmp),t=totals(selectedEmp);if($('printEmployeeName'))$('printEmployeeName').textContent=`Employee: ${e.name} | ID: ${e.id} | Designation: ${e.designation||'—'}`;const due=Math.abs(t.balance)<.005?'Settled / No Amount Due':t.balance>0?'Amount to Receive from Employee':'Amount to Pay to Employee';const dueCls=Math.abs(t.balance)<.005?'plh-settled':t.balance>0?'plh-receive':'plh-pay';let balance=t.opening,rows=[];rows.push(['','OPENING','','Opening Balance','','','',balance,'COUNTED']);if(t.paid){balance+=(t.opening<0?t.paid:-t.paid);rows.push(['','PAYMENT','','Paid Amount','','',t.paid,balance,'COUNTED'])}db.advances.filter(x=>x.empId===selectedEmp).sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>{balance+=Number(x.amount||0);rows.push([x.date,'ADVANCE',x.id,'Advance Given',x.amount,'','',balance,'COUNTED'])});db.bills.filter(x=>x.empId===selectedEmp).sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>{const st=String(x.status||'Pending');if(st==='Approved'){balance-=Number(x.amount||0);rows.push([x.date,'BILL',x.id,x.description||x.category,'',x.amount,'',balance,'APPROVED - COUNTED'])}else{rows.push([x.date,'BILL',x.id,`${x.description||x.category} (${st.toUpperCase()} - NOT COUNTING)`,'',x.amount,'',balance,`${st.toUpperCase()} - NOT COUNTING`])}});area.innerHTML=`<div class="print-ledger-hero"><div class="plh-main"><span class="plh-label">Employee Ledger</span><div class="plh-name">${esc(e.name)}</div><div class="plh-meta">Employee ID: ${esc(e.id)} &nbsp; • &nbsp; Designation: ${esc(e.designation||'—')}</div></div><div class="plh-right"><span class="plh-label">Net Balance</span><div class="plh-net">${money(t.balance)}</div><div class="plh-help ${dueCls}">${due}</div></div></div><div class="minirow"><div class="mini"><small>Opening Balance</small><b>${money(t.opening)}</b></div><div class="mini"><small>Paid Amount</small><b>${money(t.paid)}</b></div><div class="mini"><small>Total Advance</small><b>${money(t.adv)}</b></div><div class="mini"><small>Approved Expense</small><b>${money(t.bills)}</b></div><div class="mini ${Math.abs(t.balance)<.005?'net-zero':t.balance>0?'net-positive':'net-negative'}"><small>Net Balance</small><b>${money(t.balance)}</b></div><div class="mini"><small>Settlement Status</small><b>${due}</b></div></div><div class="tablewrap" style="margin-top:15px"><table><thead><tr><th>Date</th><th>Type</th><th>Reference</th><th>Description / Status</th><th>Advance</th><th>Bill</th><th>Paid</th><th>Running Balance</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${fmt(r[0])}</td><td>${r[1]}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td>${r[4]?money(r[4]):''}</td><td>${r[5]?money(r[5]):''}</td><td>${r[6]?money(r[6]):''}</td><td>${money(r[7])}${r[8]&&r[8]!=='COUNTED'?` <small style="font-weight:700">(${esc(r[8])})</small>`:''}</td></tr>`).join('')}</tbody></table></div><div class="print-footer"><strong>${esc(db.company)}</strong> • Expense &amp; Advance Management System • Generated on ${new Date().toLocaleString('en-IN')}</div>`}

function xmlEsc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}
function sheetXML(name,headers,rows){const all=[headers,...rows];return `<Worksheet ss:Name="${xmlEsc(name)}"><Table>${all.map(r=>'<Row>'+r.map(v=>`<Cell><Data ss:Type="${typeof v==='number'&&!Number.isNaN(v)?'Number':'String'}">${xmlEsc(v)}</Data></Cell>`).join('')+'</Row>').join('')}</Table></Worksheet>`}
function buildWorkbook(){
const empRows=db.employees.map(e=>{const t=totals(e.id);return[e.id,e.name,e.designation||'',t.opening,t.paid,t.adv,t.bills,t.balance,status(t)]});
const advRows=db.advances.map(x=>[x.id,x.empId,emp(x.empId)?.name||'',x.date,x.amount,x.remarks||'']);
const billRows=db.bills.map(x=>[x.id,x.empId,emp(x.empId)?.name||'',x.date,x.category||'',x.vendor||'',x.invoice||'',x.amount,x.status||'Pending',x.description||'']);
const dashRows=[['Metric','Value'],['Employees',db.employees.length],['Total Advances',db.advances.reduce((s,x)=>s+Number(x.amount||0),0)],['Approved Bills',db.bills.filter(x=>x.status==='Approved').reduce((s,x)=>s+Number(x.amount||0),0)],['Pending Bills',db.bills.filter(x=>x.status==='Pending').length],['Pending Bill Amount',db.bills.filter(x=>x.status==='Pending').reduce((s,x)=>s+Number(x.amount||0),0)],['Paid Amount',db.employees.reduce((s,e)=>s+Number(e.openingPaid||0),0)]];
const ledgerRows=[];db.employees.forEach(e=>{const t=totals(e.id);let b=t.opening;ledgerRows.push([e.id,e.name,'','OPENING','','Opening Balance','','','',b]);if(t.paid){b+=(t.opening<0?t.paid:-t.paid);ledgerRows.push([e.id,e.name,'','PAYMENT','','Paid Amount','','',t.paid,b])}db.advances.filter(x=>x.empId===e.id).forEach(x=>{b+=Number(x.amount||0);ledgerRows.push([e.id,e.name,x.date,'ADVANCE',x.id,'Advance Given',x.amount,'','',b])});db.bills.filter(x=>x.empId===e.id).forEach(x=>{if(x.status==='Approved'){b-=Number(x.amount||0);ledgerRows.push([e.id,e.name,x.date,'BILL',x.id,x.description||x.category,'',x.amount,'',b])}else ledgerRows.push([e.id,e.name,x.date,'BILL',x.id,`${x.description||x.category} (${x.status||'Pending'} - NOT COUNTING)`,'',x.amount,'',''])})});
return `<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet" xmlns:x="urn:schemas-microsoft-com:office:excel"><Styles><Style ss:ID="Header"><Font ss:Bold="1"/></Style></Styles>${sheetXML('Employees',['Emp ID','Employee','Designation','Opening Balance','Paid Amount','Advance','Approved Bills','Net Balance','Status'],empRows)}${sheetXML('Advances',['Advance ID','Emp ID','Employee','Date','Amount','Remarks'],advRows)}${sheetXML('Bills',['Bill ID','Emp ID','Employee','Date','Category','Vendor','Invoice','Amount','Status','Description'],billRows)}${sheetXML('Dashboard',dashRows[0],dashRows.slice(1))}${sheetXML('Full Ledger',['Emp ID','Employee','Date','Type','Reference','Description / Status','Advance','Bill','Paid','Running Balance'],ledgerRows)}</Workbook>`}
function downloadExcelWorkbook(filename,template=false){let xml=buildWorkbook();if(template){/* keep current data out of template */xml=buildEmptyTemplate()}const blob=new Blob([xml],{type:'application/vnd.ms-excel'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename+'.xls';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function buildEmptyTemplate(){return `<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">${sheetXML('Employees',['Emp ID','Employee','Designation','Opening Balance','Paid Amount'],[])}${sheetXML('Advances',['Advance ID','Emp ID','Date','Amount','Remarks'],[])}${sheetXML('Bills',['Bill ID','Emp ID','Date','Category','Vendor','Invoice','Amount','Status','Description'],[])}</Workbook>`}
function downloadExcelSheet(kind){let rows=[];let name='';if(kind==='employees'){name='Employee_Master';rows=[['Emp ID','Employee','Designation','Opening Balance','Paid Amount','Advance','Approved Bills','Net Balance','Status'],...db.employees.map(e=>{const t=totals(e.id);return[e.id,e.name,e.designation||'',t.opening,t.paid,t.adv,t.bills,t.balance,status(t)]})]}else if(kind==='advances'){name='Advance_Register';rows=[['Advance ID','Emp ID','Employee','Date','Amount','Remarks'],...db.advances.map(x=>[x.id,x.empId,emp(x.empId)?.name||'',x.date,x.amount,x.remarks||''])]}else if(kind==='bills'){name='Bill_Register';rows=[['Bill ID','Emp ID','Employee','Date','Category','Vendor','Invoice','Amount','Status','Description'],...db.bills.map(x=>[x.id,x.empId,emp(x.empId)?.name||'',x.date,x.category||'',x.vendor||'',x.invoice||'',x.amount,x.status||'Pending',x.description||''])]}else if(kind==='dashboard'){name='Dashboard';rows=[['Metric','Value'],['Employees',db.employees.length],['Total Advances',db.advances.reduce((s,x)=>s+Number(x.amount||0),0)],['Approved Bills',db.bills.filter(x=>x.status==='Approved').reduce((s,x)=>s+Number(x.amount||0),0)],['Pending Bills',db.bills.filter(x=>x.status==='Pending').length],['Pending Bill Amount',db.bills.filter(x=>x.status==='Pending').reduce((s,x)=>s+Number(x.amount||0),0)],['Paid Amount',db.employees.reduce((s,e)=>s+Number(e.openingPaid||0),0)]]}else{name='Full_Ledger';rows=[['Emp ID','Employee','Date','Type','Reference','Description','Advance','Bill','Paid','Running Balance'],...db.employees.flatMap(e=>{const t=totals(e.id),r=[];let b=t.opening;r.push([e.id,e.name,'','OPENING','','Opening Balance','','','',b]);if(t.paid){b+=(t.opening<0?t.paid:-t.paid);r.push([e.id,e.name,'','PAYMENT','','Paid Amount','','',t.paid,b])}db.advances.filter(x=>x.empId===e.id).forEach(x=>{b+=Number(x.amount||0);r.push([e.id,e.name,x.date,'ADVANCE',x.id,'Advance Given',x.amount,'','',b])});db.bills.filter(x=>x.empId===e.id).forEach(x=>{if(x.status==='Approved'){b-=Number(x.amount||0);r.push([e.id,e.name,x.date,'BILL',x.id,x.description||x.category,'',x.amount,'',b])}else r.push([e.id,e.name,x.date,'BILL',x.id,`${x.description||x.category} (${x.status||'Pending'} - NOT COUNTING)`,'',x.amount,'',''])});return r})]};const xml=`<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">${sheetXML(name,rows[0],rows.slice(1))}</Workbook>`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([xml],{type:'application/vnd.ms-excel'}));a.download=name+'.xls';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importBulkFile(file){const reader=new FileReader();reader.onload=()=>{try{const text=reader.result;if(file.name.toLowerCase().endsWith('.csv')){importCSVText(text);return}const xml=new DOMParser().parseFromString(text,'application/xml');if(xml.querySelector('parsererror'))throw new Error('Please upload the Excel-compatible .xls template exported by this app.');const sheets=[...xml.getElementsByTagName('Worksheet')];let counts={employees:0,advances:0,bills:0};sheets.forEach(ws=>{const name=(ws.getAttribute('ss:Name')||ws.getAttribute('Name')||'').toLowerCase();const rows=[...ws.getElementsByTagName('Row')].map(r=>[...r.getElementsByTagName('Data')].map(d=>d.textContent));if(!rows.length)return;const h=rows[0].map(v=>String(v).trim().toLowerCase());const data=rows.slice(1).filter(r=>r.some(v=>String(v).trim()!==''));if(name.includes('employee')){data.forEach(r=>{const get=k=>r[h.indexOf(k)]||'';const id=get('emp id');if(!id)return;const obj={id:String(id).trim(),name:get('employee').trim(),designation:get('designation').trim(),opening:Number(get('opening balance')||0),openingPaid:Number(get('paid amount')||0)};const i=db.employees.findIndex(e=>e.id===obj.id);if(i>=0)db.employees[i]={...db.employees[i],...obj};else db.employees.push(obj);counts.employees++})}else if(name.includes('advance')){data.forEach(r=>{const get=k=>r[h.indexOf(k)]||'';const id=get('advance id');if(!id||!get('emp id'))return;const obj={id:String(id).trim(),empId:String(get('emp id')).trim(),date:get('date'),amount:Number(get('amount')||0),remarks:get('remarks')};const i=db.advances.findIndex(x=>x.id===obj.id);if(i>=0)db.advances[i]={...db.advances[i],...obj};else db.advances.push(obj);counts.advances++})}else if(name.includes('bill')){data.forEach(r=>{const get=k=>r[h.indexOf(k)]||'';const id=get('bill id');if(!id||!get('emp id'))return;const obj={id:String(id).trim(),empId:String(get('emp id')).trim(),date:get('date'),category:get('category'),vendor:get('vendor'),invoice:get('invoice'),amount:Number(get('amount')||0),status:get('status')||'Pending',description:get('description')};const i=db.bills.findIndex(x=>x.id===obj.id);if(i>=0)db.bills[i]={...db.bills[i],...obj};else db.bills.push(obj);counts.bills++})}});save();alert(`Bulk upload completed. Employees: ${counts.employees}, Advances: ${counts.advances}, Bills: ${counts.bills}`)}catch(err){alert('Upload failed: '+err.message)}};reader.readAsText(file)}
function importCSVText(text){const lines=text.split(/\r?\n/).filter(Boolean);const rows=lines.map(line=>line.split(',').map(v=>v.replace(/^"|"$/g,'').replace(/""/g,'"')));const h=rows[0].map(v=>v.toLowerCase().trim());if(h.includes('emp id')&&h.includes('employee')){rows.slice(1).forEach(r=>{const get=k=>r[h.indexOf(k)]||'';const id=get('emp id');if(!id)return;const obj={id,name:get('employee'),designation:get('designation'),opening:Number(get('opening balance')||0),openingPaid:Number(get('paid amount')||0)};const i=db.employees.findIndex(e=>e.id===id);if(i>=0)db.employees[i]={...db.employees[i],...obj};else db.employees.push(obj)})}else if(h.includes('advance id')){rows.slice(1).forEach(r=>{const get=k=>r[h.indexOf(k)]||'';const id=get('advance id');if(!id)return;db.advances.push({id,empId:get('emp id'),date:get('date'),amount:Number(get('amount')||0),remarks:get('remarks')})})}else if(h.includes('bill id')){rows.slice(1).forEach(r=>{const get=k=>r[h.indexOf(k)]||'';const id=get('bill id');if(!id)return;db.bills.push({id,empId:get('emp id'),date:get('date'),category:get('category'),vendor:get('vendor'),invoice:get('invoice'),amount:Number(get('amount')||0),status:get('status')||'Pending',description:get('description')})})}else throw new Error('CSV headers not recognized.');save();alert('CSV bulk upload completed.')}

  cloudUser=data.user;
  const {data:prof,error:pe}=await cloud.from('profiles').select('role,full_name').eq('id',cloudUser.id).single();
  if(pe){await cloud.auth.signOut();document.getElementById('loginError').textContent='User profile not configured. Ask the administrator.';return}
  cloudRole=prof.role||'viewer';
  try{await loadCloudState();showLoggedIn();applyRoleUI();document.getElementById('loginError').textContent='';cloudMsg('');}catch(e){console.error(e);document.getElementById('loginError').textContent='Could not load cloud data: '+e.message;await cloud.auth.signOut();}
}
async function onlineLogout(){if(cloud)await cloud.auth.signOut();cloudUser=null;cloudRole=null;cloudReady=false;cloudMsg('');showLogin();}
async function initCloud(){
  setCloudLoginText();
  if(!cloudConfigured()){showLogin();document.getElementById('loginError').textContent='Online version needs Supabase setup. See the setup guide.';return}
  cloud=window.supabase.createClient(CLOUD_CONFIG.url,CLOUD_CONFIG.anonKey);
  const {data:{session}}=await cloud.auth.getSession();
  if(session){cloudUser=session.user;const {data:prof}=await cloud.from('profiles').select('role').eq('id',cloudUser.id).single();cloudRole=prof?.role||'viewer';try{await loadCloudState();showLoggedIn();}catch(e){document.getElementById('loginError').textContent='Cloud data error: '+e.message;await onlineLogout();return}}
  else showLogin();
  cloud.auth.onAuthStateChange(async(_event,session)=>{if(!session){cloudUser=null;cloudRole=null;cloudReady=false;showLogin()} });
  // Lightweight polling keeps all viewers up to date without requiring realtime configuration.
  clearInterval(cloudSyncTimer); cloudSyncTimer=setInterval(async()=>{if(cloudReady&&cloudUser){try{const {data}=await cloud.from('app_state').select('data').eq('id',1).single();if(data?.data){db=data.data;render()}}catch(e){console.warn(e)}}},15000);
}
// Replace local security/login controls with cloud account controls.
window.addEventListener('load',()=>{
  setCloudLoginText();
  const lb=document.getElementById('loginBtn');if(lb){lb.onclick=onlineLogin;}
  const lp=document.getElementById('loginPass');if(lp)lp.onkeydown=e=>{if(e.key==='Enter')onlineLogin()};
  const fab=document.getElementById('securityFab');if(fab)fab.onclick=()=>{if(confirm((cloudRole||'').toUpperCase()+' ACCOUNT\n\n'+(cloudUser?.email||'')+'\n\nLogout from this device?'))onlineLogout()};
  // Restore backup directly to cloud (admin only).
  const rf=document.getElementById('restoreFile');if(rf)rf.onchange=async e=>{const file=e.target.files[0];if(!file)return;if(cloudRole!=='admin'){alert('Only Admin can restore data.');return}const r=new FileReader();r.onload=async()=>{try{const x=JSON.parse(r.result);if(!x||!x.employees||!x.advances||!x.bills)throw new Error('Invalid backup');db=x;await cloudSaveState(false);alert('Backup restored to cloud successfully.')}catch(err){alert('Invalid backup or cloud save failed: '+err.message)}};r.readAsText(file);e.target.value=''};
  // Remove local credential/security editing UI for the online build.
  const sm=document.getElementById('securityModal');if(sm)sm.remove();
  initCloud();
});
</script>
